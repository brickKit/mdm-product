apiVersion: brickkit/v1
kind: Component

metadata:
  id: mdm/product                    # ⚠️ Fork 件必须与标准件完全一致（§3.4.1）
  name: 产品/物料主数据
  version: 1.0.1                     # 精确版本，不接受 ^ / ~ / latest
  description: SKU、分类、计量单位换算、批次/序列号追踪策略、标准成本
  license: Apache-2.0                # 平台支持这一格（manifest.Metadata.License），填上
  vendor: brickKit                   # 同上，可选但填了对交付文档有用

tags: [mdm, product, master-data]

artifacts:
  - type: api-contract
    format: protobuf
    files:
      - contracts/mdm/product/v1/product.proto
      - contracts/events/product.events.json
  - type: api-contract
    format: openapi
    files: [contracts/product.openapi.yaml]
  - type: metadata                   # ← assembly.yaml 靠这一条随组件分发（§3.5）
    files: [assembly.yaml]

dependencies:
  components: []                     # mdm 是只读枢纽，自己不调任何人（§2.6）。
                                      # ⚠️ 尤其不依赖 erp/inventory——库存数量走展示上推，不是同步调用
  resources:
    # ⚠️ engine 逐字参与匹配（设计书 §2.7.3.1）：这里写的词必须与
    #    brickkit.yaml 的 resources[].engine 完全相同，平台不认别名。
    - { kind: database, engine: postgresql }   # 产品名：不在替换范围
    - { kind: mq,       engine: nats }         # 产品名：换 Kafka 是一次迁移，要让平台阻断

configSchema:
  type: object
  properties:
    pgSchema:                        # ⚠️ 不能叫 databaseSchema，DATABASE_ 是保留前缀
      type: string
      default: mdm_product
    iamJwksUrl:                      # JWT 本地验签的公钥来源。不对 IAM 建依赖边（决策 87）
      type: string
    otelBaseUrl:                     # ⚠️ 不能叫 otelEndpoint，*_ENDPOINT 是保留后缀
      type: string
      default: ""                    # 空 → Blackhole Exporter，零成本（§7.5）
    # ⚠️ 没有 defaultPageSize/listWindowDays：mdm-customer 声明过这两项
    # 但代码从没读取——List 的默认页大小/时间窗口实际上是
    # besdk.ListWindow 的包级常量，写在这里只会让人以为能配实际不能配
    # （见 mdm-customer 的 component.yaml 与 AGENTS.md 那条记录）。

deployment:
  type: container
  image: brickenterprise/mdm-product:1.0.0
  port: 8082                         # 端口册 registry/ports.tsv
  extraPorts:
    - { name: grpc, port: 9092 }     # → MDM_PRODUCT_GRPC_ENDPOINT（值仍以 http:// 开头）
  labels:                            # 平台只搬运，不解释键值。值必须是字符串
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }

migration:
  command: ["./migrate", "up"]

healthCheck:
  type: http
  path: /healthz                     # ⚠️ 只查本进程存活，严禁查库或查依赖组件（§12.3.6）
  # startPeriodSeconds 不写：默认就是 60，Go 组件够用（§12.3.5）

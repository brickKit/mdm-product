apiVersion: brickkit/v1
kind: Component

metadata:
  id: mdm/product
  name: Product master data
  version: 2.0.0
  description: "SKUs, categories, unit-of-measure conversions, batch and serial tracking policies, and standard costs."
  repository: https://github.com/brickKit/mdm-product
  license: Apache-2.0
  vendor: brickKit

tags: [mdm, product, master-data]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/mdm/product/v1/product.proto, contracts/events/product.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/product.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: mdm_product}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8082
  extraPorts:
    - {name: grpc, port: 9092}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 100m, memory: 128Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]

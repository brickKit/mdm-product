id: mdm/product                      # 必须与 component.yaml 一致，be-ops 校验

domain: mdm
tier: backend

edge_routes:
  - { path: /mdm/product/**, auth: required }

menus:
  - { key: mdm.product, title: 产品管理, permission: mdm.product.view }

data:
  schema: mdm_product                # registry/schemas.tsv
  role:   mdm_product_rw             # 登录角色，`PG_USER` 的值

data_scopes: none                    # 产品主数据全员可见

permissions:
  - { key: mdm.product.view,   title: 查看产品主数据, type: page   }
  - { key: mdm.product.create, title: 新建产品,       type: action }
  - { key: mdm.product.edit,   title: 编辑产品,       type: action }
  - { key: mdm.product.set_status, title: 启用/停用产品, type: action }

openapi: 3.0.3
info:
  title: mdm-product · 产品/物料主数据
  version: 1.0.0
  description: |
    对外 REST 面。内部 gRPC，外部 HTTP（§2.1）。
    ⚠️ 不暴露 BatchGet/GetSummary——它们是给其他组件的 gRPC 客户端用的批量读优化
    （§2.1：内部 gRPC，外部 HTTP/GraphQL）。
    ConvertQuantity 例外：前端下单页面要实时试算换算结果，必须走后端 DryRun 接口
    （设计书 §8.4），所以它暴露到 REST。

servers:
  - url: /mdm/product

# ⚠️ /healthz 不在这份契约里：它不属于本组件的业务契约，是 be-sdk-go 的
# NewGinEngine 给每个组件统一挂的，路径固定是裸根路径 /healthz（§12.3.6）。

paths:
  /products:
    get:
      summary: List
      operationId: listProducts
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: 游标分页（决策 53），无 offset 参数——深分页在契约层面不可表达
        - name: page_size
          in: query
          schema: { type: integer }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/ProductStatus" }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: 不传时间范围时框架层自动注入最近 90 天（§11.4.1）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  next_cursor: { type: string }
    post:
      summary: Create
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/{id}:
    get:
      summary: Get
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      summary: Update
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/{id}/status:
    post:
      summary: SetStatus
      operationId: setProductStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetStatusRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/convert-quantity:
    post:
      summary: ConvertQuantity（DryRun，纯函数不落库）
      operationId: convertProductQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuantityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertQuantityResponse" }

components:
  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    TrackingType:
      type: string
      enum: [NONE, BATCH, SERIAL]

    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        category_id: { type: string }
        base_uom_id: { type: string }
        tracking_type: { $ref: "#/components/schemas/TrackingType" }
        standard_cost:
          type: string
          description: 金额一律用 string 传 decimal，绝不用 double（跨语言精度）
        status: { $ref: "#/components/schemas/ProductStatus" }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRequest:
      type: object
      required: [idempotency_key, name, base_uom_id]
      properties:
        idempotency_key:
          type: string
          description: 跨重试幂等键（§4.6），被调用方用唯一约束去重
        sku:
          type: string
          description: 可选，留空则按 "P" + 6 位自增数字生成
        name: { type: string }
        category_id: { type: string }
        base_uom_id: { type: string }
        tracking_type: { $ref: "#/components/schemas/TrackingType" }
        standard_cost: { type: string }

    UpdateRequest:
      type: object
      required: [idempotency_key, version]
      properties:
        idempotency_key: { type: string }
        version:
          type: integer
          format: int64
          description: 乐观锁，与库里不一致则拒绝
        name: { type: string }
        category_id: { type: string }
        standard_cost: { type: string }

    SetStatusRequest:
      type: object
      required: [idempotency_key, version, status]
      properties:
        idempotency_key: { type: string }
        version: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ProductStatus" }

    ConvertQuantityRequest:
      type: object
      required: [product_id, qty, from_uom_id, to_uom_id]
      properties:
        product_id: { type: string }
        qty: { type: string, description: decimal-as-string，同金额字段的理由 }
        from_uom_id: { type: string }
        to_uom_id: { type: string }

    ConvertQuantityResponse:
      type: object
      properties:
        qty:
          type: string
          description: 已按目标单位的 rounding 向上取整（CEIL，设计计划 §2.1）
